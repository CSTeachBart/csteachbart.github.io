    <script>
	window.onload = function () {
	
		for(var i = 1; i <= 20; i++){
			let check = false;
			while(!check){
				document.getElementById('g'+i).innerHTML = Math.floor(Math.random() * 25 - 8);
				document.getElementById('e'+i).innerHTML = Math.floor(Math.random() * 6 - 2);
				check = !(document.getElementById('g'+i).innerHTML==0 && document.getElementById('e'+i).innerHTML < 0)
			}
		}
	};
	
	var controleer = function (id){
		var g = document.getElementById('g'+id).innerHTML
		var e = document.getElementById('e'+id).innerHTML
		var answer = document.getElementById('s'+id).value;
		if(answer && Math.abs(g**e - answer) < 0.001) {
			document.getElementById('g'+id).style.border = "5px solid green";
		} else {
			document.getElementById('g'+id).style.border = "3px solid red";
			setTimeout(function(){resetWrong(id);}, 2000);
		}
	};
	
	var resetWrong = function(id){
		document.getElementById('g'+id).style.border = "none";
	}
    </script>
