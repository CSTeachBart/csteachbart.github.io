	body {

    <script>
	window.onload = function () {
		let primes = [31, 43, 67, 79, 103, 191, 229];
		let facts = [5, 7, 11, 13, 17, 19, 23];
		let used = [];
		let index = 0;
	
		for(var i = 1; i <= 6; i=i+1){
			index = Math.floor(Math.random()*primes.length);
			while(used.includes(index)){
				index = Math.floor(Math.random()*primes.length);
			}
			used.push(index);
			let p = primes[index];
			let g = facts[index];
			let a = Math.floor(Math.random() * 3 + 2);
			let b = Math.floor(Math.random() * 4 + 2);
			let A = (g**a) % p;
			document.getElementById('g'+i).innerHTML = g;
			document.getElementById('e'+i).innerHTML = a;
			document.getElementById('d'+i).innerHTML = p;
			
			document.getElementById('g'+(6+i)).innerHTML = A;
			document.getElementById('e'+(6+i)).innerHTML = b;
			document.getElementById('d'+(6+i)).innerHTML = p;
			
			document.getElementById('g'+(12+i)).innerHTML = g;
			document.getElementById('e'+(12+i)).innerHTML = (a*b);
			document.getElementById('d'+(12+i)).innerHTML = p;
			
		}
	};	
	var controleer = function (id){
		var g = BigInt(document.getElementById('g'+id).innerHTML);
		var d = BigInt(document.getElementById('d'+id).innerHTML);
		var e = BigInt(document.getElementById('e'+id).innerHTML);
		var answer = document.getElementById('s'+id).value;
		if(answer && Number((g**e)%d) == answer) {
			document.getElementById('g'+id).style.border = "5px solid green";
		} else {
			document.getElementById('g'+id).style.border = "3px solid red";
			setTimeout(function(){resetWrong(id);}, 2000);
		}
	};
	
	var resetWrong = function(id){
		document.getElementById('g'+id).style.border = "none";
	}
    </script>
